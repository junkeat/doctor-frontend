<header class="header">
  <div class="header__inner">
    <div class="header__left">
      <a routerLink="/" class="header__logo" aria-label="HealthLink home">
        <app-logo />
      </a>
      <nav class="header__nav" aria-label="Main">
        <a
          routerLink="/"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
          class="header__link"
          >Home</a
        >
      </nav>
    </div>

    <button
      type="button"
      class="header__user"
      aria-haspopup="menu"
      aria-controls="user-menu"
      [attr.aria-expanded]="menuOpen()"
      (click)="userMenu.toggle($event)"
    >
      <app-avatar [name]="userName()" size="small" />
      <span class="header__user-text">
        <span class="header__user-name">{{ userName() }}</span>
        <span class="header__user-role">{{ roleLabel }}</span>
      </span>
      <i class="pi pi-chevron-down header__chevron" aria-hidden="true"></i>
    </button>
    <p-menu
      #userMenu
      id="user-menu"
      [model]="menuItems"
      [popup]="true"
      appendTo="body"
      ariaLabel="User menu"
      (onShow)="menuOpen.set(true)"
      (onHide)="menuOpen.set(false)"
    />
  </div>
</header>
